name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # SYS_NICE 是必需的：Arch 打包的 /usr/bin/sway 带 cap_sys_nice=ep，
      # 容器内 root 若没有该 capability，execve 会直接返回 EPERM，
      # 报错形如 `env: 'sway': Operation not permitted`。
      options: --user root --cap-add SYS_NICE

    steps:
      - name: 安装依赖
        run: |
          pacman -Syu --noconfirm --needed \
            git gcc pkgconf wayland libjpeg-turbo libxkbcommon \
            wlr-protocols sway grim libx11 alacritty python wl-clipboard \
            xorg-xwayland

      - name: 环境自检
        run: |
          echo "sway 文件能力：$(getcap "$(command -v sway)" || echo 无)"
          echo "当前 capabilities：$(grep CapEff /proc/self/status)"
          sway --version

      - uses: actions/checkout@v4

      - name: 编译
        run: |
          ./build.sh

      - name: 检查零警告
        run: |
          out=$(./build.sh 2>&1)
          echo "$out"
          if echo "$out" | grep -qi "warning:"; then
            echo "::error::编译出现警告"
            exit 1
          fi

      - name: 冒烟测试（无头沙箱 + 抓帧）
        run: |
          set -x
          # 预热 fontconfig 缓存：容器里首次运行要建缓存，否则 sway 启动会慢很多
          fc-cache -f >/dev/null 2>&1 || true

          ./scripts/start.sh 1280x720

          # start.sh 已等到 socket 就绪，再给 wstream 一点时间连上
          for i in $(seq 1 40); do
            curl -fsS -o /dev/null http://127.0.0.1:8765/ 2>/dev/null && break
            sleep 0.5
          done
          curl -fsS -o /dev/null http://127.0.0.1:8765/
          echo "index OK"

          # ── 核心能力：抓帧 ────────────────────────────────────────────
          # 注意：这里刻意用「快照模式」而不是 MJPEG 流。
          # MJPEG 需要画面**有变化**才会产生新帧，而 CI 容器里没有可用的
          # GPU/EGL，alacritty 起不来 → 沙箱里没有任何窗口 → 画面永远静止
          # → 流里没有数据。这属于环境限制，不是抓帧功能有问题。
          WL=$(cat /tmp/wstream/wl_name)
          XDG_RUNTIME_DIR=/tmp/wstream/run WAYLAND_DISPLAY="$WL" \
            ./wstream -p 8899 -s /tmp/shot.ppm
          test -s /tmp/shot.ppm
          echo "snapshot OK ($(stat -c%s /tmp/shot.ppm) bytes)"

          # 校验快照是合法的 PPM 且尺寸正确（防止抓到空 buffer）
          head -c 20 /tmp/shot.ppm | tr '\n' ' '
          echo
          head -2 /tmp/shot.ppm | tail -1 | grep -qx "1280 720"

          ./scripts/start.sh stop

      - name: 键鼠注入回归测试
        run: |
          set -x
          # 这个测试会自己起沙箱，所以前面那份已经停掉了
          ./scripts/start.sh 1280x720

          # X11 探针：把收到的按键/鼠标事件按行打印，供精确断言
          gcc -O1 -Wall -Wextra -o tests/x11probe tests/x11probe.c \
              $(pkg-config --cflags --libs x11)

          python3 tests/wstest.py

          ./scripts/start.sh stop

      # 生命周期测试：起停是否留垃圾、死 socket 能否恢复、孤儿能否清理。
      # 这些 bug 不会让任何功能断言变红 —— 功能全好，只是每跑一次漏一批进程。
      # 用的是独立目录 /tmp/wstream-lc-test，不碰上面的默认实例。
      - name: 生命周期回归测试
        run: |
          set -x
          python3 tests/lifecycle.py

      - name: 失败时打印日志
        if: failure()
        run: |
          echo "──── sway.log ────"
          cat /tmp/wstream/sway.log 2>/dev/null || echo "(无)"
          echo "──── wstream.log ────"
          cat /tmp/wstream/wstream.log 2>/dev/null || echo "(无)"
          echo "──── 沙箱内进程 ────"
          pgrep -af alacritty 2>/dev/null || echo "(无 alacritty)"
          echo "──── X11 探针日志 ────"
          cat /tmp/x11probe.log 2>/dev/null || echo "(无)"
          echo "──── 沙箱终端输出 ────"
          cat /tmp/wstream_typed.txt 2>/dev/null || echo "(无)"

      - name: 上传快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: /tmp/shot.ppm
          if-no-files-found: ignore
